spring.application.name=planificador-academico
# Puerto (8080 está ocupado en esta PC); se puede cambiar con la variable PORT
server.port=${PORT:8081}

# Base de datos H2 en archivo (carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/planificador;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Idioma y zona horaria
spring.web.locale=es_PE
spring.web.locale-resolver=fixed
planificador.zona-horaria=America/Lima

# Vistas
spring.thymeleaf.cache=false

# Cursos de ejemplo al crear la base por primera vez (false = la app empieza vacía)
planificador.datos-ejemplo=false

# Planificador: hora desde la que se pueden programar bloques de estudio
planificador.hora-inicio-estudio=08:00

# IA para leer sílabos y horarios. Las API keys se leen de variables de entorno, nunca de aquí:
#   GEMINI_API_KEY (Gemini) · GROQ_API_KEY (Groq) · ANTHROPIC_API_KEY (Claude)
# Proveedor: auto (usa los que tengan clave en el orden de abajo; si uno falla por algo pasajero, prueba el siguiente)
# o uno fijo: gemini, groq, anthropic
planificador.ia.proveedor=auto
planificador.ia.orden=gemini, groq, anthropic
planificador.ia.anthropic.modelo=claude-sonnet-5
planificador.ia.gemini.modelo=gemini-3.8-flash
# Si el modelo principal está saturado (503), se reintenta y luego se prueban estos, en orden
planificador.ia.gemini.modelos-respaldo=gemini-3.7-flash, gemini-flash-latest
# Groq: texto con gpt-oss; fotos de horario con Qwen (único con visión). En el plan gratuito, Qwen
# permite ~1000 tokens de salida por minuto y gpt-oss ~8000 tokens por minuto en total.
planificador.ia.groq.modelo=openai/gpt-oss-120b
planificador.ia.groq.modelo-vision=qwen/qwen3.8-27b
planificador.ia.groq.maximo-tokens=6000
planificador.ia.groq.maximo-tokens-vision=1000

# Subida de sílabos en PDF
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Versiona JS/CSS por contenido: el navegador siempre carga la versión nueva
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
