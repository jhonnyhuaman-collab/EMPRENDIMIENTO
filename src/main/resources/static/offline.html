<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#235B4E">
    <title>Sin conexi&oacute;n | Planificador Acad&eacute;mico</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
            background: #DFEAE8; color: #202829; font: 16px/1.6 system-ui, sans-serif;
            padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
                max(28px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
        main { width: min(100%, 420px); text-align: center; }
        img { width: 88px; height: 88px; border-radius: 24px; }
        .marca { font-size: 14px; color: #235B4E; font-weight: 600; margin: 18px 0 32px; }
        h1 { font-size: 28px; line-height: 1.25; margin: 0 0 16px; }
        p { color: #526568; margin: 0 0 28px; }
        a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px;
            padding: 12px 24px; border-radius: 12px; background: #235B4E; color: #FFF;
            text-decoration: none; font-weight: 600; }
        a:focus-visible { outline: 3px solid #8A602C; outline-offset: 4px; }
    </style>
</head>
<body>
<main>
    <img src="/images/pwa/icon-192.png" alt="" width="88" height="88">
    <p class="marca">Planificador Acad&eacute;mico</p>
    <h1>Sin conexi&oacute;n por ahora</h1>
    <p>No podemos conectar con el servidor. Necesitas conexi&oacute;n para consultar tu plan y guardar cambios.</p>
    <a href="/">Volver a intentar</a>
</main>
</body>
</html>
