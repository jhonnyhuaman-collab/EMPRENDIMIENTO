<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="pagina-acceso">
<main class="acceso-contenedor">
    <th:block th:replace="~{fragments/layout :: marcaAcceso}"></th:block>
    <section class="acceso-panel">
        <div class="acceso-cabecera">
            <span class="acceso-emblema"><i class="bi bi-door-open-fill" aria-hidden="true"></i></span>
            <span class="sobretitulo">Tu espacio de estudio</span>
        </div>
        <h1>Qué bueno verte.</h1>
        <p class="text-body-secondary">Tu semana, a tu ritmo.</p>
        <div class="aviso-error" role="alert" th:if="${param.error}">Correo o contraseña incorrectos.</div>
        <div class="aviso-plan" role="status" th:if="${param.registrado}">Tu cuenta está lista. Ya puedes ingresar.</div>
        <div class="aviso-plan" role="status" th:if="${param.salida}">Cerraste sesión correctamente.</div>
        <form th:action="@{/login}" method="post">
            <label class="etiqueta-campo" for="email">Correo electrónico</label>
            <div class="campo-acceso">
                <i class="bi bi-envelope" aria-hidden="true"></i>
                <input class="form-control campo" id="email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="nombre@universidad.edu.pe" required>
            </div>
            <label class="etiqueta-campo mt-3" for="password">Contraseña</label>
            <div class="campo-password campo-acceso">
                <i class="bi bi-lock" aria-hidden="true"></i>
                <input class="form-control campo" id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="ver-password" type="button" title="Mostrar contraseña" aria-label="Mostrar contraseña" aria-pressed="false"><i class="bi bi-eye"></i></button>
            </div>
            <button class="btn-premium w-100 mt-4" type="submit"><i class="bi bi-box-arrow-in-right"></i>Iniciar sesión</button>
        </form>
        <p class="mt-4 mb-0 text-center">¿Primera vez? <a th:href="@{/registro}">Crear cuenta</a></p>
        <th:block th:replace="~{fragments/layout :: instalar}"></th:block>
    </section>
    <p class="acceso-pie">Un día a la vez. Tú puedes.</p>
</main>
<script th:src="@{/js/acceso.js}"></script>
</body>
</html>
